<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SFR Camera</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div>
          <p class="eyebrow">SFR</p>
          <h1>Camera stream</h1>
        </div>
        <span id="status" class="status" data-state="idle">연결 대기</span>
      </header>

      <section class="viewer" aria-label="카메라 영상">
        <iframe
          id="stream-frame"
          title="Raspberry Pi camera stream"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>
        <div id="placeholder" class="placeholder">
          <strong>WebRTC gateway에 연결하세요.</strong>
          <span>Windows PC에서 MediaMTX와 Pi 송출을 먼저 실행합니다.</span>
        </div>
      </section>

      <form id="connection-form" class="connection-form">
        <label>
          Gateway host
          <input id="gateway-host" name="gatewayHost" autocomplete="off" required />
        </label>
        <label>
          WebRTC port
          <input id="gateway-port" name="gatewayPort" type="number" min="1" max="65535" value="8889" required />
        </label>
        <label>
          Stream path
          <input id="stream-path" name="streamPath" value="camera" pattern="[A-Za-z0-9_/-]+" required />
        </label>
        <div class="actions">
          <button type="submit">연결</button>
          <button id="disconnect-button" type="button" class="secondary">연결 해제</button>
        </div>
      </form>

      <p id="stream-url" class="stream-url"></p>
    </main>
  </body>
</html>
